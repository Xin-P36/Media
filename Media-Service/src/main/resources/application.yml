server:
  port: ${SERVER_PORT:8080}

spring:
  datasource:
    driver-class-name: org.sqlite.JDBC
    url: ${SPRING_DATASOURCE_URL:jdbc:sqlite:media_manager.db}
    username: ${SPRING_DATASOURCE_USERNAME:}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  sql:
    init:
      mode: never

# --- MyBatis-Plus 配置 ---
mybatis-plus:
  type-aliases-package: org.xinp.entity
  mapper-locations: classpath:/mapper/*.xml
  global-config:
    db-config:
      id-type: auto
      db-type: sqlite
  configuration:
    map-underscore-to-camel-case: true

media:
  system: ${MEDIA_SYSTEM:linux}
  secret-string: ${MEDIA_SECRET_STRING:please-change-this-jwt-secret-key}
  initial-account: ${MEDIA_INITIAL_ACCOUNT:root}
  initial-password: ${MEDIA_INITIAL_PASSWORD:please-change-this-password}
  initial-nickname: ${MEDIA_INITIAL_NICKNAME:Admin}
